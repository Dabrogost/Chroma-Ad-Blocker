name: Publish guide

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'extension/guide/**'
      - 'scripts/build-guide.js'
      - 'scripts/guide-manifest.js'
      - 'tests/guide*.test.js'
      - 'package*.json'
      - '.github/workflows/guide-pages.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'docs/**'
      - 'extension/guide/**'
      - 'scripts/build-guide.js'
      - 'scripts/guide-manifest.js'
      - 'tests/guide*.test.js'
      - 'package*.json'
      - '.github/workflows/guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check shared guide and web links
        run: npm test -- guide
      - name: Build public guide
        run: npm run docs:build:web
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/guide-site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy guide
        id: deployment
        uses: actions/deploy-pages@v4
