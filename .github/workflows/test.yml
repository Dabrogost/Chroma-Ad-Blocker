name: Test

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run Node, policy, and package checks
        run: npm run test:ci

      - name: Select Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          browser="${{ steps.setup-chrome.outputs.chrome-path }}"
          test -x "$browser"
          echo "Using browser: $browser"
          "$browser" --version
          echo "CHROME_FOR_TESTING_PATH=$browser" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$browser" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"

      - name: Run loaded-extension E2E smoke
        timeout-minutes: 5
        run: npm run test:e2e:smoke

      - name: Run full browser E2E
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: npm run test:e2e
